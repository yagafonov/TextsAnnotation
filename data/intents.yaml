zabyl_kartu__kak_snyat_bez_karty:
  description: Намерение выражает желание пользователя узнать, как можно снять наличные
    деньги, если у него нет физической банковской карты с собой. Пользователь ищет
    информацию о возможных способах получения наличных без использования карты, например,
    через банкомат или с помощью других доступных методов.
  complexity: medium
  cluster: cash_withdrawal
  train:
    - как могу снять средств если забыл карту
    - возможно ли получить деньги без карты
    - забыла карту дома как снять наличные
    - как снять наличные если у меня нет карты
    - подскажите пожалуйста как снять деньги если у меня нет пластика
    - как совершить снятие наличных без пластика
    - как получить наличные без банковской карты
    - как с банкомата снять сумму если забыла карту
    - забыл карту могу ли снять наличные через банкомат
    - как обналичить деньги если нет карты при себе
  test: []
zabyl_kartu__kogda_vernete:
  description: Намерение выражает желание пользователя узнать, когда и как он сможет
    вернуть свою банковскую карту, оставшуюся в банкомате. Пользователь интересуется
    сроками и процессом инкассации, а также возможными действиями для возврата карты.
  complexity: low
  cluster: card_recovery
  train:
    - когда будет возвращена карта
    - когда я получу обратно карту
    - сроки инкассации
    - как долго ожидать инкассацию карты
    - когда мне вернут карту которая осталась в банкомате
    - как получить карту которую проглотил банкомат
    - в какой адрес мне подойти за возвратом карты
    - сколько дней занимает инкассация после изъятия карты банкоматом
    - когда можно забрать карту после инкассации
    - банкомат проглотил карту через сколько вернут
  test: []
