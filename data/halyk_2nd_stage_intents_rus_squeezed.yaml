    значения и назначения параметра 'КБЕ' в контексте денежных переводов и платежей.
    Пользователь хочет узнать, что такое 'КБЕ', как он используется и почему важен
    для корректной обработки финансовых операций.
  train:
  - что такое кбе
  - что означает кбе
  - объясните что такое кбе
  - что такое кбе при переводе
  - что означает кбе в платеже
  - что такое категория получателя платежа
  - для чего нужен кбе
  - что такое кбе в выпадающем списке
  - что такое кбе для корректной обработки платежа
  - что означает кбе при переводе
  test: []
what_is_knp:
  description: Намерение выражает потребность пользователя в понимании
    значения и роли кода назначения платежа (КНП) в различных финансовых операциях.
    Пользователь хочет узнать, как и зачем использовать КНП при оформлении и обработке
    платежей.
  train:
  - что такое кнп
  - что означает кнп при оформлении платежа
  - что такое код назначения платежа
  - для чего нужен кнп
  - что такое кнп в выпадающем списке
  - что означает кнп для корректной обработки платежа
  - что такое кнп код цели платежа
  - что означает кнп цель или категория платежа
  - что такое кнп параметр назначения платежа
  - что значит кнп в платеже
  test: []
deposit__otkrit:
  description: Намерение выражает желание пользователя открыть депозитный
    счет в банке, при этом часто с акцентом на возможность сделать это удаленно или
    через приложение. Пользователь также может интересоваться условиями открытия депозита
    и необходимыми для этого документами.
  train:
  - Как я могу открыть депозит
  - Хочу открыть депозит
  - Имеется ли возможность удаленно открыть депозит
  - Как дистанционно открыть вклад
  - Какие условия в банке имеются по депозиту
  - В приложении можно открыть депозит
  - Что необходимо для открытие депозита дистанционно
  - Как открыть депозит онлайн
  - Какие документы нужны для открытия онлайн депозита
  - Можно ли открыть депозит без посещения отделения
  test: []
deposit__zakrit:
  description: Намерение выражает желание пользователя закрыть свой
    депозитный счет и получить доступ к средствам, находящимся на нем. Пользователь
    интересуется способами закрытия депозита, включая возможность сделать это онлайн,
    и условиями, которые необходимо выполнить для закрытия.
  train:
  - Могу ли я закрыть депозит онлайн
  - Я хочу узнать как мне снять все деньги со своего депозита
  - Как закрыть свой депозит
  - Как закрыть депозит в личном кабинете
  - Хочу закрыть онлайн депозит и перевести деньги на карту
  - Нужно ли идти в отделение для закрытия депозита
  - Какими способами я могу закрыть депозит
  - Могу ли я закрыть депозит раньше срока
  - Какие документы нужны для закрытия депозита
  - Как закрыть депозит в приложении
  test: []
