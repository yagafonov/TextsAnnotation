zabyl_kartu__kogda_vernete:
  description: Намерение выражает желание пользователя узнать, когда и как он сможет
    вернуть свою банковскую карту, оставшуюся в банкомате. Пользователь интересуется
    сроками и процессом инкассации, а также возможными действиями для возврата карты.
  complexity: low
  cluster: card_recovery
  train:
    - когда будет возвращена карта
    - когда я получу обратно карту
    - сроки инкассации
    - как долго ожидать инкассацию карты
    - когда мне вернут карту которая осталась в банкомате
    - как получить карту которую проглотил банкомат
    - в какой адрес мне подойти за возвратом карты
    - сколько дней занимает инкассация после изъятия карты банкоматом
    - когда можно забрать карту после инкассации
    - банкомат проглотил карту через сколько вернут
  test: []
